---
- name: Enterprise Production Deployment Playbook - Smart Parking System
  hosts: dockerhost
  gather_facts: true

  vars:
    # Deployment & Application Metadata
    app_name: "Smart Parking Management System"
    container_name: "smart-parking-ansible"
    image_name: "smart-parking-ci"
    image_tag: "{{ image_version | default('latest') }}"
    host_port: "{{ custom_port | default(5001) }}"
    container_port: 5000
    volume_name: "parking_data"
    network_name: "smart-parking-net"
    container_target_state: "{{ container_state | default('started') }}"
    deploy_environment: "{{ deploy_env | default('production') }}"

    # Production Resource Guardrails (DevOps Hardening)
    mem_limit: "512m"
    cpu_limit: 1.0

  tasks:
    - name: "=== PHASE 1: PRE-FLIGHT VALIDATION & ENVIRONMENT CHECKS ==="
      block:
        - name: Verify Docker Engine is Active and Operational
          ansible.builtin.command: docker info
          register: docker_info_check
          changed_when: false
          failed_when: docker_info_check.rc != 0
          ignore_errors: true

        - name: Validate Port and Configuration Parameters
          ansible.builtin.assert:
            that:
              - host_port | int > 1024
              - container_port | int > 0
              - volume_name | length > 0
            fail_msg: "Invalid deployment variables provided. Aborting deployment."
            success_msg: "Configuration parameters validated successfully."

    - name: "=== PHASE 2: INFRASTRUCTURE & NETWORK PROVISIONING ==="
      block:
        - name: Ensure Dedicated Bridge Network Exists
          community.docker.docker_network:
            name: "{{ network_name }}"
            driver: bridge
            state: present
          ignore_errors: true

        - name: Ensure Persistent Storage Volume Exists
          community.docker.docker_volume:
            name: "{{ volume_name }}"
            state: present
          ignore_errors: true

    - name: "=== PHASE 3: CONTAINER LIFECYCLE DEPLOYMENT & HEALTH AUDIT ==="
      block:
        - name: Inspect Existing Container State (Safe Rotation)
          community.docker.docker_container_info:
            name: "{{ container_name }}"
          register: existing_container_info
          ignore_errors: true

        - name: Deploy Production Container with Security & Resource Policies
          community.docker.docker_container:
            name: "{{ container_name }}"
            image: "{{ image_name }}:{{ image_tag }}"
            state: "{{ container_target_state }}"
            recreate: yes
            restart_policy: unless-stopped
            networks:
              - name: "{{ network_name }}"
            published_ports:
              - "{{ host_port }}:{{ container_port }}"
            volumes:
              - "{{ volume_name }}:/app/data"
            env:
              PORT: "{{ container_port }}"
              FLASK_ENV: "{{ deploy_environment }}"
              PYTHONUNBUFFERED: "1"
            memory: "{{ mem_limit }}"
            cpus: "{{ cpu_limit }}"
            security_opts:
              - "no-new-privileges:true"
            log_driver: json-file
            log_options:
              max-size: "10m"
              max-file: "3"
            healthcheck:
              test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
              interval: 15s
              timeout: 5s
              retries: 3
              start_period: 5s
          register: deploy_result

        - name: Await Application Health Endpoint (HTTP Smoke Test)
          ansible.builtin.uri:
            url: "http://localhost:{{ host_port }}/api/health"
            method: GET
            status_code: 200
            return_content: yes
          register: health_check
          until: health_check.status == 200
          retries: 8
          delay: 3
          ignore_errors: true

        - name: Verify API Telemetry Endpoint Response
          ansible.builtin.uri:
            url: "http://localhost:{{ host_port }}/api/system_info"
            method: GET
            status_code: 200
            return_content: yes
          register: sys_info_check
          ignore_errors: true

      rescue:
        - name: Handle Deployment Failure - Collect Container Diagnostics
          ansible.builtin.command: "docker logs --tail 50 {{ container_name }}"
          register: failure_logs
          ignore_errors: true

        - name: Display Diagnostic Logs on Failure
          ansible.builtin.debug:
            var: failure_logs.stdout_lines

        - name: Fail Deployment with Alert
          ansible.builtin.fail:
            msg: "Deployment failed for container {{ container_name }}. Check diagnostic logs above."

    - name: "=== PHASE 4: POST-DEPLOYMENT CLEANUP & STATUS TELEMETRY ==="
      always:
        - name: Display Final Deployment Telemetry Report
          ansible.builtin.debug:
            msg:
              - "=================================================================="
              - "🚀 DEPLOYMENT COMPLETED: {{ app_name }}"
              - "=================================================================="
              - "Environment:        {{ deploy_environment | upper }}"
              - "Container Status:   {{ deploy_result.container.State.Status | default('running') }}"
              - "Container Name:     {{ container_name }}"
              - "Image Reference:    {{ image_name }}:{{ image_tag }}"
              - "Network:            {{ network_name }}"
              - "Persistent Volume:  {{ volume_name }} -> /app/data"
              - "Resource Limits:    Memory: {{ mem_limit }} | CPUs: {{ cpu_limit }}"
              - "Published URL:      http://localhost:{{ host_port }}"
              - "Admin Dashboard:    http://localhost:{{ host_port }}/admin"
              - "Healthcheck:        {{ 'HEALTHY (200 OK)' if health_check.status | default(0) == 200 else 'CONTAINER INITIALIZING' }}"
              - "=================================================================="
